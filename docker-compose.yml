services:
  db:
    image: postgres:15
    container_name: asset_tracker_db
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app_network

  mongo:
    image: mongo:7
    container_name: asset_tracker_mongo
    environment:
      MONGO_INITDB_DATABASE: asset_tracker
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - app_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset_tracker_api
    ports:
      - "3080:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      MONGODB_URI: mongodb://mongo:27017/asset_tracker
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_network

volumes:
  db_data:
  mongo_data:

networks:
  app_network:
    driver: bridge
